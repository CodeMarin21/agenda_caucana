<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar a Popayán GO — Agenda Caucana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/popayan-go.css">
</head>
<body>
<div class="auth-layout auth-layout--go">
  <div class="auth-card auth-card--go">
    <div class="auth-card__marca">
      <span class="fuente-titulos" style="color:var(--color-oro);">Popayán <em style="font-style:italic;">GO</em></span>
      <p>Explora la ciudad, suma puntos, desbloquea sellos</p>
    </div>
    <h1>Sella tu regreso</h1>
    <p class="auth-card__subtitulo">Entra con tu apodo para seguir explorando.</p>

    <form data-form-login-jugador>
      <div class="form-grupo">
        <label for="username">Apodo</label>
        <input id="username" name="username" type="text" required autocomplete="username">
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="boton boton-go">Entrar</button>
      <p class="auth-card__mensaje" data-login-jugador-mensaje></p>
    </form>

    <p class="auth-card__pie">¿Aún no tienes pasaporte? <a href="registro.html" style="color:var(--color-oro);">Créalo aquí</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/popayan-go-auth.js"></script>
</body>
</html>
