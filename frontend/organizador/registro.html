<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de organizador — Agenda Caucana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-card" style="max-width:30rem;">
    <div class="auth-card__marca">
      <a href="../index.html"><span class="fuente-titulos">Agenda Caucana</span></a>
      <p>Plataforma de creadores</p>
    </div>
    <h1>Crea tu cuenta de organizador</h1>
    <p class="auth-card__subtitulo">Después de registrarte, un administrador revisa y verifica tu cuenta antes de que puedas publicar eventos.</p>

    <form data-form-registro-organizador>
      <div class="form-grupo">
        <label for="nombreOrg">Nombre de la organización</label>
        <input id="nombreOrg" name="nombreOrganizacion" type="text" required placeholder="Ej. Fundación Folclórica del Cauca">
      </div>
      <div class="form-grupo">
        <label for="nombreContacto">Nombre de contacto</label>
        <input id="nombreContacto" name="nombreContacto" type="text" required>
      </div>
      <div class="form-fila">
        <div class="form-grupo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-grupo">
          <label for="telefono">Teléfono de contacto</label>
          <input id="telefono" name="telefono" type="tel" required>
        </div>
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="boton boton-primario">Crear cuenta de organizador</button>
      <p class="auth-card__mensaje" data-registro-mensaje></p>
    </form>

    <p class="auth-card__pie">¿Ya tienes cuenta? <a href="../login.html">Inicia sesión</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
