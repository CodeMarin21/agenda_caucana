<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Agenda Caucana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-card__marca">
      <a href="index.html"><span class="fuente-titulos">Agenda Caucana</span></a>
      <p>La cartelera cultural de Popayán</p>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="auth-card__subtitulo">Para publicar eventos o administrar la plataforma.</p>

    <form data-form-login>
      <div class="form-grupo">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="boton boton-primario">Iniciar sesión</button>
      <p class="auth-card__mensaje" data-login-mensaje></p>
    </form>

    <p class="auth-card__pie">
      <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
    </p>

    <p class="auth-card__pie">
      ¿Tienes un evento y aún no tienes cuenta?
      <a href="organizador/registro.html">Regístrate como organizador</a>
    </p>

    <p class="auth-card__pie">
      ¿Eres jugador de Popayán GO?
      <a href="popayan-go/login.html">Inicia sesión aquí</a>
      · <a href="popayan-go/registro.html">Crear pasaporte</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
